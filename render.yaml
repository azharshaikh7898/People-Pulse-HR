# Render Blueprint: backend web service + free PostgreSQL.
# The frontend is deployed separately on Vercel (see README).
services:
  - type: web
    name: peoplepulse-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run on every deploy before the server starts.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: peoplepulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://peoplepulse.vercel.app

databases:
  - name: peoplepulse-db
    plan: free
    databaseName: peoplepulse
